AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 Linux/Windows/Both with Apache/IIS and fixed MyIP restriction
 
# ---------------- PARAMETERS ----------------
Parameters:
 
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
 
  InstanceType:
    Type: String
    Default: t3.micro
 
  OSChoice:
    Type: String
    AllowedValues:
      - Linux
      - Windows
      - Both
    Default: Linux
 
  LinuxAMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
 
  WindowsAMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-windows-latest/Windows_Server-2022-English-Full-Base
 
# ---------------- CONDITIONS ----------------
Conditions:
  LaunchLinux: !Or
    - !Equals
      - !Ref OSChoice
      - Linux
    - !Equals
      - !Ref OSChoice
      - Both
  LaunchWindows: !Or
    - !Equals
      - !Ref OSChoice
      - Windows
    - !Equals
      - !Ref OSChoice
      - Both
 
# ---------------- RESOURCES ----------------
Resources:
 
  # VPC
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
 
  # Subnet
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
 
  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
 
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
 
  # Route Table
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
 
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
 
  SubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable
 
  # Security Group (MyIP HARDCODED HERE)
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MyIP SSH/RDP and HTTP public
      VpcId: !Ref VPC
      SecurityGroupIngress:
 
        # SSH (Linux)
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 14.99.81.62/32
 
        # RDP (Windows)
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: 14.99.81.62/32
 
        # HTTP (Public Website)
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
 
  # ---------------- LINUX EC2 ----------------
  LinuxInstance:
    Condition: LaunchLinux
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      ImageId: !Ref LinuxAMI
      UserData: !Base64 |
        #!/bin/bash
        dnf update -y
        dnf install httpd -y
        systemctl start httpd
        systemctl enable httpd
        echo "<h1>Linux Apache Server</h1>" > /var/www/html/index.html
 
  # ---------------- WINDOWS EC2 ----------------
  WindowsInstance:
    Condition: LaunchWindows
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      ImageId: !Ref WindowsAMI
      UserData: !Base64
        Fn::Sub: |
          <powershell>
          Install-WindowsFeature -name Web-Server -IncludeManagementTools
          Set-Content -Path "C:\inetpub\wwwroot\index.html" -Value "<h1>Windows IIS Server</h1>"
          </powershell>
 
# ---------------- OUTPUTS ----------------
Outputs:
 
  LinuxPublicIP:
    Condition: LaunchLinux
    Description: Linux Server Public IP
    Value: !GetAtt LinuxInstance.PublicIp
 
  WindowsPublicIP:
    Condition: LaunchWindows
    Description: Windows Server Public IP
    Value: !GetAtt WindowsInstance.PublicIp
